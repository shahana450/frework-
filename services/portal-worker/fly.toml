# Fly.io deployment for the FreBook portal worker — Mumbai region, always on (sessions live in memory).
# First time:  fly launch --copy-config --no-deploy   (keep this file; pick a unique app name)
#              fly secrets set WORKER_KEY=<long random secret>
#              fly deploy
app = "frebook-portal-worker"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
