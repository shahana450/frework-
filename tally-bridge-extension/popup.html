<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; width: 260px; padding: 16px; margin: 0; background: #0f172a; color: #e2e8f0; }
    h2 { margin: 0 0 8px; font-size: 15px; color: #a78bfa; }
    p { margin: 0 0 10px; font-size: 12px; color: #94a3b8; line-height: 1.5; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
  </style>
</head>
<body>
  <h2>FreWork Tally Bridge</h2>
  <p>Active on <strong>frework.online</strong>. This extension lets FreWork Finance connect to Tally Prime running on this computer.</p>
  <div class="status">
    <div class="dot"></div>
    <span>Bridge is running</span>
  </div>
</body>
</html>
